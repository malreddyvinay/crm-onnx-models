name: fetch-blogs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r blog-fetch/requirements.txt
      - run: python blog-fetch/download.py
      - name: Commit results
        run: |
          git config user.name "blog-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog-fetch/store
          git diff --staged --quiet || (git commit -m "blog fetch $(date -u +%F)" && git push)
